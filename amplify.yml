# AWS Amplify Hosting build: deploy the Gen 2 backend (guest book data), then build the site.
# `ampx pipeline-deploy` also writes amplify_outputs.json, which the frontend build reads.
version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        # Backend tooling is installed here (not from the lockfile) so a deploy never waits on it locally.
        - npm install --no-save --cache .npm --prefer-offline @aws-amplify/backend@^1 @aws-amplify/backend-cli@^1 aws-cdk-lib@^2 constructs@^10 esbuild tsx typescript
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
