# AWS Amplify Hosting build: deploy the Gen 2 backend (guest book data), then build the site.
# `ampx pipeline-deploy` also writes amplify_outputs.json, which the frontend build reads.
version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
